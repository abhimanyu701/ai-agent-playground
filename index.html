<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Agent Playground - A simple interactive button application">
    <title>AI Agent Playground</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Agent Playground</h1>
            <p class="subtitle">Welcome to the interactive demo</p>
        </header>
        
        <main>
            <!-- User Login Form -->
            <div class="form-container">
                <h2 class="form-title">Login to Continue</h2>
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your email"
                            required
                            autocomplete="email"
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password"
                            required
                            minlength="6"
                            autocomplete="current-password"
                        >
                    </div>
                    
                    <button type="submit" class="submit-button">
                        Login
                    </button>
                </form>
            </div>

            <!-- Existing Button Container -->
            <div class="button-container">
                <button id="clickButton" class="click-button">
                    Click me
                </button>
                <p id="clickCounter" class="counter">Clicks: 0</p>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2024 AI Agent Playground</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
