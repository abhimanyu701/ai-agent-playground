<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Agent Playground - A simple interactive button application">
    <title>AI Agent Playground</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div>
                    <h1>AI Agent Playground</h1>
                    <p class="subtitle">Welcome to the interactive demo</p>
                </div>
                <button id="logoutButton" class="logout-button" style="display: none;">
                    Logout
                </button>
            </div>
        </header>
        
        <main>
            <div class="button-container">
                <button id="clickButton" class="click-button">
                    Click me
                </button>
                <p id="clickCounter" class="counter">Clicks: 0</p>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2024 AI Agent Playground</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
